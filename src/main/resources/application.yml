# 应用服务 WEB 访问端口
server:
  port: 7890
  servlet:
    context-path: /api


spring:
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://${datasource.url}/birdhelp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&autoReconnect=true&autoReconnectForPools=true&maxReconnects=3&initialTimeout=3000
    username: ${datasource.username}
    password: ${datasource.password}
  redis:
    host: ${redis.host}
    port: ${redis.port}
    database: ${redis.database}
    password: ${redis.password}
  mail:
    host: ${mail.host}
    port: ${mail.port}
    username: ${mail.username}
    password: ${mail.password}
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: true
            required: true
  rabbitmq:
    host: ${rabbitmq.host}
    port: ${rabbitmq.port}
    virtual-host: ${rabbitmq.vhost:/}
    username: ${rabbitmq.username}
    password: ${rabbitmq.password}
    connection-timeout: 5000
    publisher-confirm-type: correlated
    publisher-returns: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      idType: ASSIGN_ID
      logic-delete-field: delFlag
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:/mapper/**/*.xml
  check-config-location: true


knife4j:
  enable: true
  basic:
    # 接口文档账号密码
    enable: ${knife4j.basic.enable}
    username: ${knife4j.basic.username}
    password: ${knife4j.basic.password}
  openapi:
    title: 水课帮接口文档
    group:
      default:
        group-name: 默认分组
        api-rule: package
        api-rule-resources:
          - com.greendam.birdhelp.controller
jwt:
  user-secret-key: ${jwt.user-secret-key}
  user-token-name: token
  user-ttl: 3600000
  admin-secret-key: ${jwt.admin-secret-key}
  admin-token-name: admin-token
  admin-ttl: 7200000
internal-api:
  public-key: ${internal-api.public-key}
  timestamp-window: 300
ai-module:
  base-url: ${ai-module.base-url}
  private-key: ${ai-module.private-key}

mail:
  from: ${mail.from}
  from-name: ${mail.from-name:BirdHelp}
app:
  upload-dir: ./upload
alioss:
  access-key-id: ${alioss.access-key-id}
  access-key-secret: ${alioss.access-key-secret}
  bucket-name: ${alioss.bucket-name}
  endpoint: ${alioss.endpoint}
birdhelp:
  rabbitmq:
    exchange: birdhelp.doc.generation
    queue: birdhelp.doc.generation.tasks
    dlx: birdhelp.doc.generation.dlx
    dlq: birdhelp.doc.generation.dlq
  api-key:
    encryption-secret: ${api-key.encryption-secret}
alimessage:
  access-key-id: ${alimessage.access-key-id}
  access-key-secret: ${alimessage.access-key-secret}
  endpoint: ${alimessage.endpoint}
  sign-name: ${alimessage.sign-name}
  template-code: ${alimessage.template-code}